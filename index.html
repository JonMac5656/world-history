const eraOf=y=>{for(let i=ERAS.length-1;i>=0;i--)if(y>=ERAS[i][0])return i;return 0};
const lab=e=>(e[1]?"c. ":"")+(e[0]<0?-e[0]+" BCE":e[0]+" CE");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const pts=[[-3100,0],[0,.3],[1500,.55],[2030,1]];
const pos=y=>{for(let i=1;i<pts.length;i++)if(y<=pts[i][0]){const[a,b]=[pts[i-1],pts[i]];return a[1]+(y-a[0])/(b[0]-a[0])*(b[1]-a[1])}return 1};
EV.forEach((e,i)=>{e.id=i;e.era=eraOf(e[0])});
const st={q:"",era:-1,cat:"",reg:"",desc:false};
$("sub").textContent=`${EV.length} events across ${ERAS.length} eras, from 3100 BCE to 2022. Search, filter and explore.`;
const opts=(el,label,k)=>{const v=[...new Set(EV.map(e=>e[k]))].sort();el.innerHTML=`<option value="">${label}</option>`+v.map(x=>`<option>${esc(x)}</option>`).join("")};
opts($("cat"),"All categories",3);opts($("reg"),"All regions",2);
$("chips").innerHTML=ERAS.map((e,i)=>`<button class="chip" data-i="${i}" aria-pressed="false" style="--c:${col(i)}"><i></i>${esc(e[1])}</button>`).join("");
$("strip").innerHTML=EV.map(e=>`<button class="t" data-id="${e.id}" style="left:${pos(e[0])*100}%;--c:${col(e.era)}" title="${esc(lab(e)+": "+e[4])}" aria-label="${esc(lab(e)+": "+e[4])}"></button>`).join("");
const match=e=>(st.era<0||e.era===st.era)&&(!st.cat||e[3]===st.cat)&&(!st.reg||e[2]===st.reg)&&(!st.q||(e[4]+" "+e[5]+" "+e[2]+" "+e[3]+" "+lab(e)).toLowerCase().includes(st.q));
function render(){
 const f=EV.filter(match);if(st.desc)f.reverse();
 const ids=new Set(f.map(e=>e.id));
 document.querySelectorAll("#strip .t").forEach(t=>t.classList.toggle("off",!ids.has(+t.dataset.id)));
 document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(+c.dataset.i===st.era)));
 $("count").textContent=`Showing ${f.length} of ${EV.length} events`;
 if(!f.length){$("list").innerHTML='<div class="empty">No events match these filters.<br><button id="clr2">Clear filters</button></div>';$("clr2").onclick=clear;return}
 let h="",cur=-1;
 for(const e of f){
  if(e.era!==cur){cur=e.era;h+=`<h2 style="--c:${col(cur)}"><i></i>${esc(ERAS[cur][1])}</h2><p class="ed">${esc(ERAS[cur][2])}</p>`}
  h+=`<article class="ev" id="e${e.id}" style="--c:${col(e.era)}"><div class="d">${esc(lab(e))}</div><div><h3><a href="https://en.wikipedia.org/w/index.php?search=${encodeURIComponent(e[6])}" target="_blank" rel="noopener noreferrer">${esc(e[4])}</a></h3><p>${esc(e[5])}</p><div class="tags"><b>${esc(e[3])}</b> in ${esc(e[2])}</div></div></article>`}
 $("list").innerHTML=h;
}
function clear(){Object.assign(st,{q:"",era:-1,cat:"",reg:""});$("q").value="";$("cat").value="";$("reg").value="";render()}
$("q").oninput=e=>{st.q=e.target.value.trim().toLowerCase();render()};
$("cat").onchange=e=>{st.cat=e.target.value;render()};
$("reg").onchange=e=>{st.reg=e.target.value;render()};
$("ord").onclick=e=>{st.desc=!st.desc;e.target.textContent=st.desc?"Newest first":"Oldest first";render()};
$("clr").onclick=clear;
$("chips").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;const i=+c.dataset.i;st.era=st.era===i?-1:i;render()};
$("strip").onclick=e=>{const t=e.target.closest(".t");if(!t)return;const el=$("e"+t.dataset.id);if(!el)return;
 el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"center"});
 el.classList.add("hl");setTimeout(()=>el.classList.remove("hl"),1800)};
render();
</script></body></html>
